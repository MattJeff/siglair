name: siglair

# `.env` est lu automatiquement par docker compose : c'est lui qui porte les
# secrets et les clés tierces. Les valeurs ci-dessous ne surchargent que ce qui
# est spécifique au réseau des conteneurs (hôte `db`, chemins internes).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: siglair
      POSTGRES_PASSWORD: siglair
      POSTGRES_DB: siglair
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siglair -d siglair"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: siglair:latest
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://siglair:siglair@db:5432/siglair
      STORAGE_DIR: /data/storage
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  renderer:
    # Même image, commande différente (cf. Dockerfile).
    build:
      context: .
      dockerfile: Dockerfile
    image: siglair:latest
    command: ["renderer"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://siglair:siglair@db:5432/siglair
      STORAGE_DIR: /data/storage
    volumes:
      # Volume partagé : le renderer écrit les GIF, l'API les sert sur /s/{slug}.gif.
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      # L'API applique les migrations au démarrage ; attendre évite un crash-loop
      # du worker sur des tables absentes au tout premier `up`.
      api:
        condition: service_healthy
    # Chromium alloue ses buffers de rendu en mémoire partagée. Les 64 Mo par
    # défaut de Docker le font planter au milieu d'une capture, sans message clair.
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x renderer > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: siglair-web:latest
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    # Reverse proxy + TLS automatique. En local il n'apporte rien (le front est
    # servi par `npm run dev` avec son proxy Vite), d'où le profil : on ne le
    # démarre qu'avec `docker compose --profile proxy up -d`.
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Un nom de domaine ici (ex. siglair.app) déclenche Let's Encrypt.
      SITE_ADDRESS: ${SITE_ADDRESS:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
