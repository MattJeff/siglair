name: siglair

# Le nom du projet reste `siglair`, comme le répertoire /opt/siglair, l'image
# ghcr.io/mattjeff/siglair et le domaine. Renommer obligerait à toucher au
# serveur — c'est exactement ce qu'on cherche à éviter. Le CODE est celui
# d'InternationalAgent (agentos-server) ; l'infrastructure est restée en place.
#
# `.env` est lu automatiquement par docker compose : c'est lui qui porte les
# secrets. La liste complète des variables et leur effet est dans
# apps/server/src/config.rs, seul endroit du binaire qui lit l'environnement.
#
# Un seul fichier compose, volontairement. Il en existait deux (compose.yml
# hérité de siglair, docker-compose.yml venu d'InternationalAgent) et docker
# compose n'en lit qu'un : `compose.yml` gagne et l'autre était ignoré en
# silence — un `docker compose up -d` lancé pour avoir la base de dev aurait
# démarré la pile de production.

x-logs: &logs
  driver: json-file
  # Le serveur écrit du JSON sur stdout à `agentos_server=debug`. Sans plafond,
  # un conteneur bavard remplit le disque du serveur et emporte la base avec.
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    # PAS postgres:16-alpine. `migrations/0004_knowledge.sql` fait
    # `create extension vector` et `Db::migrate()` tourne au DÉMARRAGE, avant
    # que le listener ne se lie : sans pgvector le serveur ne démarre pas, il
    # redémarre en boucle. Une extension PostgreSQL est un fichier sur le
    # serveur, pas un GRANT — c'est une propriété de l'IMAGE, `CREATE EXTENSION`
    # ne peut pas l'installer. pg18 + pgvector >= 0.8.6 : les images 0.8.0-0.8.2
    # ont une corruption d'index HNSW au vacuum. Même image que la CI.
    image: pgvector/pgvector:pg18
    environment:
      # `postgres`, superutilisateur, et pas un rôle applicatif : les migrations
      # font `create extension` et `create role app_role` — deux droits de
      # cluster. `Db::tenant_tx` fait ensuite `SET LOCAL ROLE app_role` et les
      # tables sont en FORCE ROW LEVEL SECURITY, donc se connecter en
      # superutilisateur est sûr *et* c'est ce que le code attend.
      POSTGRES_USER: postgres
      # Défini dans .env. Le défaut ne sert qu'au développement local : en
      # production POSTGRES_PASSWORD doit être aléatoire. Attention, il n'est lu
      # qu'à la CRÉATION du volume — le changer ensuite ne change rien.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: agentos
    ports:
      # 127.0.0.1 par défaut, et ce n'est pas de la prudence excessive : Docker
      # publie ses ports via des règles DNAT insérées AVANT celles d'ufw. Un
      # « ufw deny 5442 » ne protège pas un port publié ici. Sur une machine
      # publique, un 0.0.0.0 sur Postgres c'est une base ouverte sur Internet.
      # 5442 est le défaut de scripts/test.sh.
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5442}:5432"
    volumes:
      # `agentos_pgdata` et pas `pgdata`, et les deux moitiés comptent.
      #
      #   * Le nom : `pgdata` résoudrait vers le volume `siglair_pgdata` déjà
      #     présent sur le serveur, qui contient un cluster PostgreSQL 16.
      #     pg18 refuse de démarrer dessus. Un volume neuf est obligatoire.
      #   * Le chemin : pg18 veut le montage sur /var/lib/postgresql, PAS
      #     .../data — l'image refuse de démarrer sur l'ancien chemin
      #     (docker-library/postgres#1259).
      - agentos_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentos"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped
    logging: *logs

  browser:
    # Le Chromium des employés — « notre Browserbase » (docs/BROWSER.md dans
    # InternationalAgent). `api` lui parle en CDP par le réseau des conteneurs :
    # BROWSER_CDP_URL=http://browser:9222 dans .env sélectionne l'adaptateur.
    #
    # Épinglée par DIGEST, pas par tag : `stable` bouge à chaque version de
    # Chromium, et le pilote CDP a déjà vu un flux changer sous le parseur (cf.
    # le CLI Claude, épinglé pour la même raison). C'est aussi ce qui dispense
    # scripts/deploy.sh d'un `pull` : une référence par digest ne bouge jamais,
    # et quand ce fichier en change, `up -d` tire la nouvelle parce qu'elle
    # n'est pas en local. Digest de l'index multi-arch relevé le 2026-09-10 sur
    # registry-1.docker.io (Chromium 151.0.7922.109, base debian:trixie-slim).
    image: chromedp/headless-shell:stable@sha256:2d349b544a1ea6b5b5fd7c0fe99215ff662339c57407ee2e8c0a11af93516b04
    # tini comme PID 1 : Chromium laisse des zombies derrière ses renderers,
    # la README de l'image le dit elle-même.
    init: true
    # Ce que l'image contient, relevé couche par couche sans Docker : bash,
    # dash, grep, socat — ni curl ni wget. Son entrypoint `/headless-shell/run.sh`
    # lance `socat TCP4-LISTEN:9222,fork TCP4:127.0.0.1:9223` puis
    # `headless-shell --no-sandbox --use-gl=angle --use-angle=swiftshader
    # --remote-debugging-address=0.0.0.0 --remote-debugging-port=9223 $@`.
    #
    # Deux raisons de le réécrire ici plutôt que de le laisser faire :
    #
    #   1. `$@` y est SANS guillemets : `--host-resolver-rules="MAP db …"`
    #      serait éclaté en cinq mots, et Chromium ouvrirait `db` comme une URL
    #      au lieu de l'interdire. Le "$@" ci-dessous est quoté.
    #   2. `--remote-debugging-address` est IGNORÉ par headless_shell : sa
    #      fabrique de socket n'écoute que 127.0.0.1 / ::1
    #      (headless/lib/browser/headless_devtools.cc, CreateLocalHostServerSocket).
    #      C'est pour ça que l'image passe par socat, et c'est pour ça qu'on le
    #      garde : sans lui, `api` ne joint pas 9222.
    #
    # `$$@` : docker compose interpole `$`, `$$` en rend un seul.
    entrypoint:
      - bash
      - -c
      - 'socat TCP4-LISTEN:9222,fork,reuseaddr TCP4:127.0.0.1:9223 & exec /headless-shell/headless-shell "$$@"'
      - headless-shell
    command:
      # Les trois premiers sont ceux de run.sh. Pas de `--headless=new` : ce
      # binaire est le mode sans tête, le drapeau n'y ajoute rien.
      - --no-sandbox
      - --use-gl=angle
      - --use-angle=swiftshader
      - --remote-debugging-port=9223
      - --disable-gpu
      # Sans /dev/shm suffisant Chromium plante en silence ; ce drapeau le fait
      # écrire dans /tmp, et shm_size ci-dessous couvre ce qu'il y met malgré tout.
      - --disable-dev-shm-usage
      # Un script de page ne peut pas frapper la base, l'API, la console ou le
      # proxy par le navigateur : ces noms ne résolvent pas. Le port CDP n'étant
      # pas publié, personne d'autre ne le peut non plus. scripts/check-compose.sh
      # échoue si cette ligne disparaît.
      - --host-resolver-rules=MAP db ~NOTFOUND, MAP api ~NOTFOUND, MAP web ~NOTFOUND, MAP caddy ~NOTFOUND, MAP localhost ~NOTFOUND
    shm_size: 256m
    # Pas de `ports:`. Le port CDP n'a AUCUNE authentification : qui le joint
    # pilote un navigateur qui sort sur Internet. Seul `api` l'atteint, par nom.
    healthcheck:
      # Ni curl ni wget dans l'image, mais bash y est avec /dev/tcp. Par 9222,
      # donc à travers socat : c'est le chemin qu'`api` emprunte. HTTP/1.0 sans
      # en-tête Host, exprès : Chromium répond 500 à tout Host qui n'est ni une
      # IP ni localhost — `api` doit envoyer l'IP du conteneur, pas `browser`.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/9222 && printf "GET /json/version HTTP/1.0\r\n\r\n" >&3 && grep -q webSocketDebuggerUrl <&3']
      interval: 5s
      timeout: 3s
      retries: 12
    # 1 Go sur les ~2,9 Go libres du VPS (3 819 Mo, db 1 Go, api et web 512 Mo) :
    # ≈ 400 Mo de base + 100-150 Mo par onglet, d'où BROWSER_MAX_TABS=3 côté
    # adaptateur. Au-delà de la limite c'est un renderer que le noyau tue, pas
    # la base.
    mem_limit: 1g
    restart: unless-stopped
    logging: *logs

  api:
    # `build:` pour le développement local. En production l'image est construite
    # par GitHub Actions et seulement tirée : sur 2 vCPU une compilation Rust en
    # release met un quart d'heure et le pic mémoire peut faire tuer autre chose
    # par l'OOM.
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_REPO:-siglair}:${IMAGE_TAG:-latest}
    env_file: [.env]
    environment:
      # Écrase ce que .env pourrait dire : dans le réseau des conteneurs l'hôte
      # de la base est `db`, jamais localhost.
      DATABASE_URL: ${SIGLAIR_DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/agentos}
      # DEFAULT_BIND de config.rs vaut 8080 ; .env.example dit 8090. On fixe
      # ici, sinon un .env recopié d'un poste de dev publie sur un port que
      # Caddy et le healthcheck du déploiement ne regardent pas.
      APP_BIND: 0.0.0.0:8080
    ports:
      # Loopback uniquement. Seul Caddy est public : il termine le TLS et relaie.
      # Publier l'API en clair à côté offrirait un chemin sans HTTPS vers les
      # clés d'API. Ce port existe pour scripts/deploy.sh, qui interroge
      # http://127.0.0.1:8080/livez depuis l'hôte — l'image runtime ne contient
      # ni curl ni wget, donc le HEALTHCHECK doit venir de dehors.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      # Sain, pas seulement démarré : l'adaptateur lit /json/version au premier
      # tour, et un Chromium encore en train de se lancer serait un tour perdu.
      browser:
        condition: service_healthy
    volumes:
      # Le HOME du CLI Claude : `~/.claude/` (identifiants OAuth) et
      # `~/.claude.json`. Sans ce volume, chaque recréation de conteneur
      # déconnecte tous les employés — et la reconnexion est manuelle (§4 de
      # docs/DEPLOY_SIGLAIR.md). Le HOME entier plutôt que `~/.claude` seul :
      # les deux chemins comptent.
      - claude_home:/home/agentos
    mem_limit: 512m
    restart: unless-stopped
    logging: *logs

  web:
    # La console. Son dépôt est internationagent-web et construit sa propre
    # image ; ce fichier ne fait que la tirer. Deux pipelines, chacun
    # propriétaire de ce qu'il produit.
    image: ${WEB_IMAGE:-ghcr.io/mattjeff/internationagent-web}:${WEB_TAG:-latest}
    env_file: [.env]
    environment:
      # **L'API n'est pas jointe par le domaine public.** Elle est jointe par
      # le réseau des conteneurs, côté serveur, et sa clé bearer ne quitte donc
      # jamais le processus de la console. Écrit ici plutôt que dans .env, pour
      # la même raison que DATABASE_URL l'est : un .env recopié d'un poste de
      # développement pointerait ailleurs.
      AGENTS_API_URL: http://api:8080
    # Pas de `ports:`. Seul Caddy l'atteint, et c'est tout ce qu'il faut : une
    # console publiée en clair à côté du TLS offrirait un chemin sans HTTPS
    # vers un cookie de session.
    depends_on:
      api:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped
    logging: *logs

  caddy:
    # Reverse proxy + TLS automatique. En local il n'apporte rien, d'où le
    # profil : `docker compose --profile proxy up -d`.
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # SITE_ADDRESS=siglair.com déclenche Let's Encrypt. Vide = HTTP local :80.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      SITE_WWW_ADDRESS: ${SITE_WWW_ADDRESS:-www.${SITE_ADDRESS:-localhost}}
      SITE_CANONICAL_URL: ${SITE_CANONICAL_URL:-https://${SITE_ADDRESS:-localhost}}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logs

volumes:
  agentos_pgdata:
  claude_home:
  caddy_data:
  caddy_config:
