<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060911" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <title>Siglair | Signature email marketing animée</title>
    <meta
      name="description"
      content="Transformez chaque email en canal marketing : signature animée, campagnes et CTA, mise à jour sans copier-coller, analytics, Gmail et Outlook."
    />
    <link rel="canonical" href="https://siglair.com/" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!--
      Partage social (DESIGN.md §10). Il reste volontairement sans og:image tant qu'une image
      d'aperçu dédiée et maintenue n'existe pas dans public/.
      Pas de <meta name="keywords"> : ignoré par les moteurs depuis quinze ans.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siglair" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://siglair.com/" />
    <meta property="og:title" content="Siglair | Signature email marketing animée" />
    <meta
      property="og:description"
      content="Transformez chaque email en canal marketing : signature animée, campagnes et CTA, mise à jour sans copier-coller, analytics, Gmail et Outlook."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Siglair | Signature email marketing animée" />
    <meta
      name="twitter:description"
      content="Transformez chaque email en canal marketing : signature animée, campagnes et CTA, mise à jour sans copier-coller, analytics, Gmail et Outlook."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
