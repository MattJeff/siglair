<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#060911" />
    <title>Siglair — générateur de signature email professionnelle animée</title>
    <meta
      name="description"
      content="Créez une signature email professionnelle, animée et hébergée pour Gmail, Outlook et Apple Mail. Mise à jour sans copier-coller, repli Outlook, signatures d’équipe et analytics."
    />

    <!--
      Partage social (DESIGN.md §10). Volontairement SANS og:url, canonical ni og:image :
      le domaine n'est pas acheté et aucune image d'aperçu n'existe dans public/. Une balise
      qui pointe dans le vide donne un lien laid sur LinkedIn et Slack — pire que son absence.
      À ajouter ensemble le jour où le domaine et l'image existent.
      Pas de <meta name="keywords"> : ignoré par les moteurs depuis quinze ans.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siglair" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Siglair — générateur de signature email professionnelle animée" />
    <meta
      property="og:description"
      content="Créez une signature email professionnelle, animée et hébergée pour Gmail, Outlook et Apple Mail. Mise à jour sans copier-coller, repli Outlook, signatures d’équipe et analytics."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
